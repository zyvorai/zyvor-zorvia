# Lab-only: advertise lab.zorvia.io/fake-gpu without NVIDIA hardware.
# Host char device is created by scripts/lab-fake-gpu-device.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: zorvia-lab-devices
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fake-gpu-device-plugin
  namespace: zorvia-lab-devices
  labels:
    app.kubernetes.io/name: fake-gpu-device-plugin
    app.kubernetes.io/part-of: zorvia-lab
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-gpu-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-gpu-device-plugin
    spec:
      priorityClassName: system-node-critical
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      containers:
        - name: device-plugin
          image: ghcr.io/squat/generic-device-plugin:latest
          imagePullPolicy: IfNotPresent
          args:
            - --domain=lab.zorvia.io
            - --device
            - |
              name: fake-gpu
              groups:
                - count: 1
                  paths:
                    - path: /var/lib/zorvia-lab-devices/fake-gpu
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: fake-devs
              mountPath: /var/lib/zorvia-lab-devices
              readOnly: true
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: fake-devs
          hostPath:
            path: /var/lib/zorvia-lab-devices
            type: Directory
