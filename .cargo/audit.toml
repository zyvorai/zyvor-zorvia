[advisories]
# RUSTSEC-2023-0071 (Marvin timing attack in `rsa`): no patched release exists.
# `rsa` is only pulled in by jsonwebtoken. Zorvia only verifies OIDC RS256
# tokens with public keys and holds no RSA private keys, so the timing attack
# on private-key operations is not reachable.
# Revisit when `rsa` publishes a fix.
ignore = ["RUSTSEC-2023-0071"]
