{{- if and .Values.httpRoute.enabled .Values.httpRoute.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "zorvia.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zorvia.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.httpRoute.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      {{- with (first .Values.httpRoute.hostnames) }}
      hostname: {{ . | quote }}
      {{- end }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.httpRoute.gateway.tlsSecretName }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
