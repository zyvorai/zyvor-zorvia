version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: ["dependencies", "rust"]
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: ["dependencies", "web"]
    ignore:
      # typescript-eslint's peer range stops below TypeScript 6.1, so a major
      # bump makes `npm ci` fail with ERESOLVE. Revisit once it supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "docs"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 15
    labels: ["dependencies", "ci"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
