name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 8388608
  REGISTRY: ghcr.io
  # Published as ghcr.io/zyvorai/zorvia (matches the chart, docs and deploy scripts), not the repo slug.
  IMAGE_NAME: zyvorai/zorvia

permissions:
  contents: read

# Runs on the org's self-hosted Linux runners (no paid GitHub-hosted minutes).
# macOS and linux-arm64 binaries are not built here: there is no self-hosted macOS
# runner and the Linux runners have neither passwordless sudo nor an arm64 cross toolchain.
jobs:
  test:
    name: Test
    runs-on: [self-hosted, zyvor-build, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Lint
        run: cargo fmt --all -- --check && cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --verbose
        env:
          RUST_MIN_STACK: 8388608

  build:
    name: Build (${{ matrix.target }})
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: zorvia-linux-amd64
    runs-on: [self-hosted, zyvor-build, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/zorvia dist/${{ matrix.artifact }}
          chmod +x dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  docker:
    name: Docker Image
    needs: [test]
    runs-on: [self-hosted, zyvor-build, docker]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Write image digest
        run: |
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" > image-digest.txt
          cat image-digest.txt

      - name: Upload digest artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest
          path: image-digest.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        continue-on-error: true

      - name: Cosign sign image (keyless)
        continue-on-error: true
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

  rescue-agent-docker:
    name: Rescue-agent Docker Image
    needs: [test]
    runs-on: [self-hosted, zyvor-build, docker]
    # Not a `release` gate dependency: an issue building this optional,
    # not-yet-live-tested image shouldn't block the main zorvia release.
    continue-on-error: true
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/rescue-agent.Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/zyvorai/zorvia-rescue-agent:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/zyvorai/zorvia-rescue-agent:latest

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        continue-on-error: true

      - name: Cosign sign image (keyless)
        continue-on-error: true
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/zyvorai/zorvia-rescue-agent@${{ steps.push.outputs.digest }}

  release:
    name: GitHub Release
    needs: [build, docker]
    runs-on: [self-hosted, zyvor-build, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist

      - name: Checksums
        run: |
          find dist -type f -name 'zorvia-*' -print0 | sort -z | xargs -0 sha256sum | tee SHA256SUMS
          cat SHA256SUMS

      - name: Download image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-digest
          path: .
        continue-on-error: true

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/zorvia-linux-amd64/zorvia-linux-amd64
            SHA256SUMS
            image-digest.txt
